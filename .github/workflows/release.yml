name: 发布（免安装程序 / Docker 镜像）

# 打「不用装任何东西就能跑」的两个版本：
#   ① 单文件可执行程序（Windows / Linux / macOS）：Node SEA，把 node 运行时和整份后端
#      塞进一个文件里，双击就起服务，数据是旁边 data/ 里的 SQLite；
#   ② Docker 镜像（ghcr.io）：扔到服务器/群晖上 `docker run` 就完事，数据挂在 /data。
#
# 两者跟线上 Cloudflare Worker 跑的是同一份 backend/index.js，只是数据库换成
# 本机 SQLite（server/d1.mjs 是那层适配）。所以先跑仓库自检，再打包。
#
# 触发：
#   - 推一个 tag（v1.0.0 / v1.1 …）→ 打包 + 发 GitHub Release + 推镜像 :版本号 和 :latest
#   - 手动 workflow_dispatch → 只打包并留成 Actions 产物（不发 Release、镜像打 :latest）

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 先跑自检：语法 / 路由重名 / schema 建库 / SQL / 前端绑定。红了就别打包出去害人。
  check:
    name: 自检
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # 光跑静态自检不够：以前 release 只验「代码能解析」，打包出来的东西能不能跑完全没验。
      # 这几个是纯离线的（不需要起服务、不连库），出错说明前端首屏/401 重放/分批这些真坏了。
      - run: node scripts/check.mjs
      # workflow 自己的 YAML 写错了，GitHub 会整个 job 不跑 —— 报错还看不懂。
      # 这里先自己用 python3 的 yaml 解析一遍，语法错当场红。
      - name: workflow YAML 语法
        run: |
          python3 - <<'PY'
          import glob, yaml, sys
          bad = 0
          for f in glob.glob('.github/workflows/*.yml'):
              try:
                  yaml.safe_load(open(f, encoding='utf-8'))
                  print('  OK', f)
              except Exception as e:
                  print('  ❌', f, e); bad += 1
          sys.exit(1 if bad else 0)
          PY
      - run: node scripts/check-manifest.mjs
      - run: node scripts/test-batch.mjs
      - run: node scripts/test-key-queue.mjs
      - run: node scripts/test-firstscreen.mjs
      - run: node scripts/test-list.mjs
      - run: node scripts/test-offline.mjs
      # 备份口径自检：口令类的东西不能混进备份包（包是要往外发的）
      - run: node scripts/check-backup.mjs
      # 第 4 本账演练要自己起 server/main.mjs（依赖 hono），必须先装后端依赖。
      - name: 装后端依赖（第 4 本账演练要起本机服务）
        run: npm ci
        working-directory: backend
      - run: node scripts/test-book4.mjs
      # 定时任务回归：worker 的 scheduled() 4 条 cron 各跑一遍（自包含，不依赖外部服务）
      - run: node scripts/test-cron.mjs
      # 离线件套一把跑完（run-all.mjs --offline = scripts/run-all.mjs 里的 OFFLINE 清单）。
      # 以前这里是一个个手写步骤，加测试时容易漏；现在清单只有一个事实源。
      - name: 离线件套一把跑完
        run: node scripts/run-all.mjs --offline
      # 联网件套里最要紧的六件也补上（以前 release 完全没跑，坏了要到用户手上才发现）：
      # 备份恢复、员工权限、并发、超管、员工端、老备份兼容。
      # 它们要打一个真服务，所以先起本机版（本机版和线上跑的是同一份 backend/index.js）。
      - name: 起本机版服务（联网件套要打它）
        run: |
          nohup node server/main.mjs --port 8791 --no-open --no-cron > /tmp/fa-server.log 2>&1 &
          for i in $(seq 1 60); do
            if node -e "fetch('http://127.0.0.1:8791/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              echo "服务起来了（等了 ${i}s）"; exit 0
            fi
            sleep 1
          done
          echo "::error title=本机服务没起来::等了 60 秒 /version 还是不通"
          tail -60 /tmp/fa-server.log || true
          exit 1
        working-directory: .
      - name: 联网件套六件（备份恢复 / 权限 / 并发 / 超管 / 员工端 / 老备份）
        run: |
          set -e
          node scripts/test-restore.mjs --base http://127.0.0.1:8791 --key 8888
          node scripts/test-perm.mjs --base http://127.0.0.1:8791 --key 8888
          node scripts/test-concurrency.mjs --base http://127.0.0.1:8791 --key 8888
          node scripts/test-super.mjs --base http://127.0.0.1:8791 --key 8888
          node scripts/test-staff.mjs --base http://127.0.0.1:8791 --key 8888
          node scripts/test-oldbackup.mjs --base http://127.0.0.1:8791 --key 8888
        working-directory: .
      # 文档和代码对不上就别发版：接口清单、网页版教程都是从源文件生成的产物，
      # 忘了重新生成的话，发出去的 exe 里带的是旧教程。
      - run: node scripts/gen-api-list.mjs --check
      - run: node scripts/gen-guide.mjs --check
      # 镜像标签钉在 compose / README / DEPLOYMENT 三处，发版时必须与这个 tag 一致，
      # 否则「照文档 docker compose up」拉到的还是上一版（v1.1.0 就发生过）。
      # 第 13 轮 E1：手动触发（workflow_dispatch）时 github.ref_name 是分支名（main），
      # 拿它跟 v1.3.0 比必然不等 —— 手动跑一次发布就红一次，其实什么都没错。
      # 现在只有「推 tag」的那个入口才把 tag 名传进去做比对；手动触发只校验三处文档彼此一致。
      - run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.ref_name }}" ]; then
            node scripts/check-version.mjs "${{ github.ref_name }}"
          else
            echo "手动触发：只校验 compose / README / DEPLOYMENT 三处版本号一致（不拿分支名当版本号比）"
            node scripts/check-version.mjs
          fi

  exe:
    name: 打包 ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: 安装构建依赖
        run: npm ci
        working-directory: backend
      # 这一步里自带自测：打完会真的跑一遍（/version、落地页、建库 60 张表），
      # 不通就让整个 job 红掉，不会把坏文件发出去。
      - name: 打包（并自测）
        run: node scripts/build-exe.mjs --out dist
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
      # 校验和按平台分开命名：三个平台原来都写 SHA256SUMS.txt，最后 upload-artifact
      # 用 merge-multiple 合并时互相覆盖，发出去的 SHA256SUMS.txt 只剩一个平台一行。
      - name: 算校验和
        shell: bash
        run: |
          cd dist
          OUT="SHA256SUMS-${{ matrix.name }}.txt"
          : > "$OUT"
          for f in *; do
            case "$f" in SHA256SUMS*) continue;; esac
            node -e "const c=require('node:crypto'),fs=require('fs');const h=c.createHash('sha256').update(fs.readFileSync(process.argv[1])).digest('hex');console.log(h+'  '+process.argv[1])" "$f" >> "$OUT"
          done
          cat "$OUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bin-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: 发 Release
    needs: exe
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 才有完整 tag 历史，下面要算「上一个 tag 到今天改了哪些东西」
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: bins
      # 各平台各交了一份 SHA256SUMS-<平台>.txt，这里合并成一份给用户下载，
      # 并且自己重算一遍再断言「三个文件都在」—— 以前 merge 时互相覆盖，
      # 发出去的校验和只有一行（README 却写着三个），用户拿去对不上。
      - name: 合并校验和（并断言三个平台都在）
        shell: bash
        run: |
          cd bins
          rm -f SHA256SUMS.txt
          for f in *; do
            case "$f" in SHA256SUMS*) continue;; esac
            node -e "const c=require('node:crypto'),fs=require('fs');const h=c.createHash('sha256').update(fs.readFileSync(process.argv[1])).digest('hex');console.log(h+'  '+process.argv[1])" "$f" >> SHA256SUMS.txt
          done
          N=$(wc -l < SHA256SUMS.txt)
          echo "校验和 $N 行："; cat SHA256SUMS.txt
          if [ "$N" -ne 3 ]; then echo "::error::应该有 3 个可执行文件，实际 $N 个"; exit 1; fi
      # Release 说明 = 用法（固定）+ 这次改了什么（git log 自动拼）。
      # 以前既写自定义 body 又开 generate_release_notes，结果 GitHub 只留了 compare 链接，
      # 每次发版用户都不知道改了什么。
      - name: 写 Release 说明
        shell: bash
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')
          {
            echo '## 怎么用'
            echo ''
            echo '**Windows**：下载 `factory-accounting-windows-x64.exe`，双击。浏览器会自己打开'
            echo '`http://127.0.0.1:8787`，先设一个口令，然后就能记账了。数据在 exe 旁边的'
            echo '`data/` 目录里，把这个目录拷走就是备份。'
            echo ''
            echo '**Linux / macOS**：下载对应文件，`chmod +x` 后直接跑。macOS 第一次打开如果提示'
            echo '「无法验证开发者」，右键 → 打开，或 `xattr -d com.apple.quarantine <文件>`。'
            echo ''
            echo '**手机小程序**：手机和电脑连同一个 Wi-Fi，把小程序的 `API_BASE` 改成'
            echo '`http://<电脑IP>:8787` 即可（电脑 IP 在程序启动的窗口里和落地页上都写着）。'
            echo ''
            echo '**Docker**（推荐服务器/群晖）：'
            echo '```'
            echo 'docker run -d --name factory -p 8787:8787 -v factory-data:/data \'
            echo '  ghcr.io/tel9980/factory-accounting:'"${GITHUB_REF_NAME}"''
            echo '```'
            echo ''
            echo '免安装版跑的是和线上同一份后端，只是数据库换成本机 SQLite；账目、备份、导出、'
            echo '打印页全都在。第一次启动会自动建好 60 张表，不用手工初始化。'
            echo ''
            echo '## 这次改了什么'
            echo ''
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty='- %s' "$PREV"..HEAD | head -60
            else
              git log --no-merges --pretty='- %s' -30 HEAD
            fi
            echo ''
            echo '## 校验和'
            echo ''
            echo '见 `SHA256SUMS.txt`（三个文件都在里面）。'
          } > RELEASE_BODY.md
          head -20 RELEASE_BODY.md
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            bins/*
          body_path: RELEASE_BODY.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: 推镜像到 GHCR
    # 等 exe 也打包成功再推镜像：镜像和 exe 是同一份后端，
    # exe 那边挂了（比如 esbuild 打不出来、SEA 注入失败），镜像却先发出去 :latest，
    # 就成了「拉到的镜像和下载的 exe 不是一回事」。
    needs: [check, exe]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # latest 只在推 tag（真发版）时才打；手动 workflow_dispatch 只打 :sha，
          # 否则一次随手跑就把 :latest 指到没测过的东西上。
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 版本号打进镜像（Dockerfile 里 ARG VERSION → ENV FACTORY_VERSION）。
          # 以前镜像里没有版本信息，docker run 起来后 /version 只能显示 dev，
          # 出问题分不清是哪个版本。
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 推上 GHCR 不算好：backend/perm-rules.mjs 是顶层 import，backend/guide.js 是运行期
      # 动态 import，两者只要漏 COPY，容器一起就 ERR_MODULE_NOT_FOUND。
      # 这里把刚推上去的镜像拉回来真跑一个容器（CI runner 自带 curl），
      # 打三个接口：/version（免口令，确认服务活着）、/help（走完整鉴权链，需要先设口令）、
      # /guide（唯一会动态 import('./guide.js') 的路由，返回 200 才说明 guide.js 真的进镜像了）。
      - name: docker run 冒烟（/version、/help、/guide 必须都是 200）
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$(echo "${{ steps.meta.outputs.tags }}" | head -1 | tr -d '\r')"
          echo "冒烟镜像：$IMAGE"
          docker pull --platform linux/amd64 "$IMAGE"
          docker rm -f smoke-factory >/dev/null 2>&1 || true
          docker run -d --name smoke-factory -p 8787:8787 -e FACTORY_DATA=/data "$IMAGE"
          # 首次启动要建库，等 /version 通了再往下测（最多等 60 秒）
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/version >/dev/null 2>&1; then break; fi
            sleep 2
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/version)
          echo "/version → $code"
          if [ "$code" != "200" ]; then docker logs smoke-factory; exit 1; fi
          # 刚起的新容器还没有口令：先在口令外面设一个，再带着口令访问 /help
          curl -fsS -X POST http://127.0.0.1:8787/auth/setup \
            -H 'content-type: application/json' -d '{"key":"smoke1234"}' >/dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'x-access-key: smoke1234' http://127.0.0.1:8787/help)
          echo "/help → $code"
          if [ "$code" != "200" ]; then docker logs smoke-factory; exit 1; fi
          # /guide 是唯一走动态 import('./guide.js') 的路由：200 才证明 guide.js 真的被 COPY 进去了
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/guide)
          echo "/guide → $code"
          if [ "$code" != "200" ]; then docker logs smoke-factory; exit 1; fi
          docker logs smoke-factory | tail -20 || true
          docker rm -f smoke-factory >/dev/null 2>&1 || true
