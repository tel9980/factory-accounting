name: 自检 + 部署 Cloudflare Worker

# 为什么先自检再部署：README 里记过的坑（路由重名被顶掉、reconRate 双重计数、
# loadHealth 定义了两次首页分数条从来不渲染、按 schema.sql 新装建不出表）
# 全是「机器一秒能看出来、当时没人看」。scripts/check.mjs 把这些做成一条命令，
# 红了就别上生产。

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      # 本机版（exe / Docker）的入口在这一层，改它必须跑冒烟
      - 'server/**'
      # 改工作流本身也要跑一遍：不然 YAML 写错了没人发现（本次就是靠这条才验证到的）
      - '.github/**'
      # 容器相关：Dockerfile / compose 改了，镜像行为就变了（数据目录、端口、健康检查）
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docs/**'
      - 'README.md'
      - 'DEPLOYMENT.md'
      - 'SECURITY.md'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'server/**'
      - '.github/**'
  workflow_dispatch:

# 同一分支上连续 push 时取消旧的部署，避免老版本后落地把生产回退。
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# 默认给只读：部署和摘要都不需要写仓库内容，出了事也不会被自动化改坏东西
permissions:
  contents: read

jobs:
  check:
    name: 自检（语法 / 路由重名 / schema 建库 / SQL / 前端绑定）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 要 node 24：自检用内置 node:sqlite 在内存里真建一遍库，node 20 没有这个模块
          node-version: 24
      - name: 跑自检
        run: node scripts/check.mjs
      # README 里的接口清单是自动生成的。后端加了/改了接口而忘了重新生成，
      # 文档就跟不上代码（这半年已经发生过两次）。--check 只比对、不改文件。
      - name: README 接口清单是不是最新的
        run: node scripts/gen-api-list.mjs --check
      - name: 使用教程网页是不是最新的
        run: node scripts/gen-guide.mjs --check
      - name: 镜像版本号（compose / README / DEPLOYMENT）一致
        run: node scripts/check-version.mjs
      - name: 合批回归（首屏 18 个请求不许退回逐个发）
        run: node scripts/test-batch.mjs
      - name: 口令排队回归（401 的请求要排队重放，不许悄悄丢掉）
        run: node scripts/test-key-queue.mjs
      - name: 首屏分波回归（第一波只发首屏要用的，第二波延后补）
        run: node scripts/test-firstscreen.mjs
      - name: 列表分页回归（重新拉第一页不许在旧列表后面追加）
        run: node scripts/test-list.mjs
      # 弱网攒了十几笔、网回来后按顺序补发：中间一笔被拒不能连累后面的，
      # 补发途中又记的一笔不能丢，口令过期要停下来等登录而不是把每条都标成「口令错误」。
      - name: 离线补发回归（没补上的留在「待补」里，补上的不许重复、补发途中新记的不许丢）
        run: node scripts/test-offline.mjs

  smoke:
    name: 起本地服务，GET 全打一遍 + 写接口按业务顺序跑一遍
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: 安装依赖
        run: npm ci
        working-directory: backend
      - name: 依赖体检（有已知漏洞只提示，不拦部署）
        run: npm audit --audit-level=high || true
        working-directory: backend
      - name: 用 schema.sql 灌本地库（顺便验证新装能用）
        # 三本账都灌：内置演示入口进的是第 3 本账，只灌主账套的话演示账套是空库，
        # /ar 会 500 no such table: accounts —— 部署到线上时同理，DEPLOYMENT 5.0 写了。
        run: |
          npx wrangler d1 execute factory-db --local --file=schema.sql
          npx wrangler d1 execute factory-db2 --local --file=schema.sql
          npx wrangler d1 execute factory-db3 --local --file=schema.sql
        working-directory: backend
        env:
          CI: '1'
      - name: 起本地 server（等到能回话再往下走）
        # 以前是「nohup 起服务 → 直接打冒烟」，wrangler 冷启动要 3~10 秒，
        # 偶尔就把「还没起来」当成「接口坏了」，红一次要重跑整个 job。
        # 现在每 1 秒问一次 /version，最多等 90 秒；等不到就把日志打出来再失败。
        run: |
          nohup npx wrangler dev --local --port 8791 --ip 127.0.0.1 > /tmp/wd.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8791/version > /dev/null 2>&1; then echo "服务起来了（等了 ${i}s）"; exit 0; fi
            sleep 1
          done
          echo "::error title=本地服务没起来::等了 90 秒 /version 还是不通"
          tail -60 /tmp/wd.log || true
          exit 1
        working-directory: backend
        env:
          CI: '1'
          WRANGLER_SEND_METRICS: 'false'
      - name: 接口冒烟（500 就算坏）
        run: node scripts/smoke.mjs --base http://127.0.0.1:8791 --key 8888
      # 功能模块开关：关掉的模块接口必须真 403（不能只是界面上藏起来），打开后立刻恢复；
      # 应收/应付/支出/导入这四块谁都不能关。
      # 这一步必须排在「写接口冒烟」前面：它要验「从没改过开关的账本里，计件工资默认是关的」，
      # 而写接口冒烟第一步就会把所有模块打开（要跑全部接口），跑过之后就没有默认状态可验了。
      - name: 功能模块开关回归（含计件工资默认关着）
        run: node scripts/test-modules.mjs --base http://127.0.0.1:8791 --key 8888
      # 写接口（记账/收付款/台账）以前一次都没在 CI 里跑过：一个字段写错、
      # 一个少 bind 的参数，要等真人在手机上点那一下才炸。这个脚本在新库上
      # 按业务顺序跑 45 步，再把其余写路由用空 body 打一遍看有没有 5xx。
      - name: 写接口冒烟（POST/PATCH/DELETE 也跑一遍）
        run: node scripts/smoke-write.mjs --base http://127.0.0.1:8791 --key 8888
      # 跨月/跨年：结账锁定以前按「单据是哪个月开的」拦，12 月一结账，
      # 1 月收 12 月那笔单的尾款就被 403 挡住。这个脚本专门守这条线。
      - name: 跨月 / 跨年回归（结账后还能收上月的尾款）
        run: node scripts/test-crossmonth.mjs --base http://127.0.0.1:8791 --key 8888
      # 应付分类：硫酸/磷酸/硝酸/染料/除油剂/包装/报纸/外发加工费这些分类要能导进去、
      # 能按分类汇总；同时守两条老账：老模板（供应商,金额,备注）不能导坏，
      # 名字里带数字（「王五金2店」）不能让金额悄悄变成 2 块。
      - name: 应付分类回归（模板下拉 / 老模板兼容 / 名字带数字）
        run: node scripts/test-apcat.mjs --base http://127.0.0.1:8791 --key 8888
      # 应收分类（货款 / 加工费 / 打样费 / 模具费 / 运费代垫）：
      # 分类写歪不会报错，只会让「加工费收了多少」永远算不出来，所以要有回归。
      - name: 应收分类回归（模板 / 粘贴 / 筛 / 汇总）
        run: node scripts/test-arcat.mjs --base http://127.0.0.1:8791 --key 8888
      # Excel 导入：应收按客户对账金额、应付按供应商/外发对账金额、房东租金押金走待摊。
      # 顺带钉死一个老坑：读 xlsx 不看单元格格式时，20000~60000 的金额会被当成 Excel 日期序号，
      # 「押金 20000」读成 1954-09-13、「应付 30000」直接变空丢掉。
      - name: Excel 导入回归（对账金额 / 付房东押金 / 金额不被当日期）
        run: node scripts/test-import-xlsx.mjs --base http://127.0.0.1:8791 --key 8888
      # 开账向导：一屏填完「账户余额 / 默认账期 / 期初应收 / 期初应付」。
      # 这四件事以前分散在三个页面，第一次上手的人根本不知道该去哪；合并成一次提交后，
      # 最容易坏的就是「一次提交」本身：漏写一块、重复点翻倍、余额被累加而不是设成实际数。
      - name: 开账向导回归（四块一次填完 / 重复点不翻倍）
        run: node scripts/test-onboarding.mjs --base http://127.0.0.1:8791 --key 8888
      # 这些 bug 的共同点是「接口 200、账却错了」：员工口令能清库、整户收款多出来的钱丢了、
      # 发工资补发被挡、已结账月份还补摊销、回收站恢复丢核销金额、收据期末欠不减核销、
      # 首页逾期笔数被 LIMIT 截断、撤销核销绕过月结锁。只能真打接口才看得见。
      - name: 钱不能算错回归（守卫 / 预收 / 补发工资 / 月结锁 / 回收站 / 收据）
        run: node scripts/test-safety.mjs --base http://127.0.0.1:8791 --key 8888
      # 微信审核因为「登录受限（3.3）」驳回过一次：审核员拿不到口令进不去。
      # 演示口令必须真的是只读——能看、不能改、不能导出、不能改口令。只读漏一条，
      # 等于把整个账本放开给任何拿到这个口令的人。
      - name: 演示口令回归（审核用只读，改不了账也导不走）
        run: node scripts/test-demo.mjs --base http://127.0.0.1:8791 --key 8888
      - name: 报表存档回归（日报 / 月报 / 年报 / 应收 / 应付 / 明细账 / 科目余额表都要能出 Excel）
        run: node scripts/test-archive.mjs --base http://127.0.0.1:8791 --key 8888
      - name: 整账套回归（导出 / 导入 / 一键初始化；会清空再导回，放最后跑）
        run: node scripts/test-book.mjs --base http://127.0.0.1:8791 --key 8888
      # 备份 / 恢复逐列：以前验的是「能恢复」，而恢复时三张主表的列清单是手写的 ——
      # 加一列忘了同步，恢复完接口照样回 ok、页面照样能看，只是那一列静默变默认值
      # （ar_cat 丢过、tax_* 丢过、inv_state 丢过、no_invoice 丢过）。这条把备份、清空、恢复
      # 之后每一行的每一列逐一比一遍，差一个单元格就红。会清空账本，所以跟在 test-book 后面。
      - name: 备份恢复逐列回归（恢复后每一列都得和备份里一样）
        run: node scripts/test-restore.mjs --base http://127.0.0.1:8791 --key 8888
      # 超级管理员：一个口令管所有账套 + 每本账自己的管理员口令（互相不能串）
      - name: 超级管理员回归
        run: node scripts/test-super.mjs --base http://127.0.0.1:8791 --key 8888
      # 员工账号与权限（网页 /pc 第 7 块）：模块权限、只看自己录的单、只看自己负责的客户。
      # 这几条松了就是「员工能改账、能看别人的客户」，账本身不会报错。
      - name: 员工账号与权限回归
        run: node scripts/test-staff.mjs --base http://127.0.0.1:8791 --key 8888
      # 权限与可见性：员工/演示身份能碰的东西必须是白名单。越权从来不报错 —— 员工 4 位 PIN
      # 就能建内部转账、拖走含成本的全量单子，页面上看不出来、老板也收不到提示。这条测试把源码里
      # 所有写接口逐个打一遍，白名单外的必须 403；新加接口忘了想权限，它就会红。
      - name: 权限与可见性回归（员工 / 演示 只能做该做的事）
        run: node scripts/test-perm.mjs --base http://127.0.0.1:8791 --key 8888
      # 一个人管账的现实是「几个模板来回填」：开账一次、之后每天只维护日常那本。
      # 多页签解析、按页签名分发、整包指纹防重、账户期初是「设」不是「加」、
      # 期初借支/借款不许动现金 —— 这几条错了不会报错，只会让开账的数翻倍或凭空多出一笔支出。
      - name: 模板包回归（开账全套 / 日常台账 / 整包一次导入）
        run: node scripts/test-pack.mjs --base http://127.0.0.1:8791 --key 8888
      # 一个人管账，日常就是「下载模板 → 填 → 传」。这条链路上出问题全是静默的：
      # 模板里不刷卡的话名字天天手打、打错一个字就对不上那个客户；供应商名没预填就一直是空表；
      # 导错了撤不回来只能一条条手删，报销撤的时候忘了退借支的「已用」，员工余额就永远对不上。
      # 三段：模板预填 / 预览说清错在哪 / 整批撤回（含借支退回、预付摊销一起删）。
      - name: 模板链路回归（预填名字、预览给全部错误行、导错了能整批撤）
        run: |
          node scripts/test-template-fill.mjs --base http://127.0.0.1:8791 --key 8888
          node scripts/test-preview.mjs --base http://127.0.0.1:8791 --key 8888
          node scripts/test-undo.mjs --base http://127.0.0.1:8791 --key 8888
      # 大文件切片上传：手机上选几 MB 的 Excel 时走的路。以前是一个请求塞 4MB base64，
      # 弱网超时后用户不知道导进去没有，重发一次就导两遍。切片后新的失败方式全是静默的：
      # 少一片、片号不连续、长度对不上 —— 拼出来是坏文件，只会报「读不了这个 Excel」。
      - name: 大文件切片上传回归（几 MB 的 Excel 分片传、断了能接着传）
        run: node scripts/test-upload.mjs --base http://127.0.0.1:8791 --key 8888
      # 税和票错了不会报错：含税/不含税算反了利润就偏、税金另外收付算成货款那张单就提前结清、
      # 有票没票没记下来月底就不知道该交多少。所以真打接口逐条钉住。
      - name: 税和票回归（含税 / 不含税 / 有票没票 / 税金另外收付）
        run: node scripts/test-tax.mjs --base http://127.0.0.1:8791 --key 8888
      # 数字对账：把「同一件事的几种说法」摆在一起比（首页 / 月报 / 科目余额表 / 报表页 / 流水页）。
      # 这类错不会报错、也没有 5xx —— 只会在厂长手机上出现「首页说收了 2000、流水说 3200」，
      # 然后谁都不信账。差一分钱就红。
      - name: 数字对账回归（首页 / 月报 / 科目余额表 / 流水页 对得上）
        run: node scripts/test-numbers.mjs --base http://127.0.0.1:8791 --key 8888
      # 账套之间不串：备份 id 是每本账各自从 1 数的，界面又都叫「回到某一天」，
      # 一旦列表没跟着切账套刷、或者恢复时不核对属于哪本，就会把 A 的账恢复进 B —— 而且显示「回来了」。
      # 顺带钉住「把 A 的整库包导进 B，B 的账本名 / 模块开关 / 口令 / 超级口令 必须还是 B 自己的」。
      - name: 账套隔离回归（备份不串本、恢复认账套、设置不被别人的包带走）
        run: node scripts/test-bookiso.mjs --base http://127.0.0.1:8791 --key 8888
      # 并发：两个人同时点「收款」「+记一笔应收」「撤销认领」会怎样。
      # 这类错最典型的样子是「一单收了两次钱」「同一笔应收生成两张单」——页面不报错，账错一倍。
      # 还得靠 SQL 自带条件（不是靠测试跑得快），所以这里同时钉住那些条件还在（第 19 组静态护栏）。
      - name: 并发回归（两人同时点同一笔，只能记一次）
        run: node scripts/test-concurrency.mjs --base http://127.0.0.1:8791 --key 8888
      # 老备份兼容：用户手里可能躺着半年前导出的包（orders 没有 month/ar_cat/tax_*，
      # ledger 没有 inv_state/inv_no/tax）。这类包恢复进去不会报错，只是分类报表变「未分类」、
      # 税表归零、按月报表少几个月。这条把「老包恢复后数字对不对」钉住；会覆盖账本，放最后跑。
      - name: 老备份兼容回归（半年前导出的包还能不能恢复）
        run: node scripts/test-oldbackup.mjs --base http://127.0.0.1:8791 --key 8888
      # 免安装版（exe / Docker 镜像）跑的是同一份 backend/index.js，只是把 Cloudflare 的 D1
      # 换成了本机 SQLite（server/d1.mjs）。这层适配最容易悄悄坏：batch 不是事务、
      # run() 返回的形状不对（README 迭代 285 那个「库存已扣却回 409」），都会让账记歪但不报错。
      # 所以每个 push 都用本机模式再跑一遍冒烟，坏在合并前、不是坏在厂长电脑上。
      - name: 本机版（Node 直跑）冒烟
        run: |
          rm -rf /tmp/fa-ci
          node server/main.mjs --port 8792 --data /tmp/fa-ci --no-open --no-cron > /tmp/fa-local.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8792/version > /dev/null 2>&1; then echo "本机版起来了（等了 ${i}s）"; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8792/version > /dev/null || { echo "::error::本机版 60 秒没起来"; tail -60 /tmp/fa-local.log; exit 1; }
          node scripts/smoke.mjs --base http://127.0.0.1:8792 --key 8888
          node scripts/smoke-write.mjs --base http://127.0.0.1:8792 --key 8888
      - name: 挂了就打印 server 日志
        if: failure()
        run: tail -80 /tmp/wd.log; echo ---; tail -40 /tmp/fa-local.log || true

  deploy:
    name: 部署到 Cloudflare
    needs: [check, smoke]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: 安装依赖
        run: npm ci
        working-directory: backend
      # 这个仓库一直没配 CF_API_TOKEN（2026-11 查过：GitHub 里 0 个 secret），
      # 所以「部署」这步从加上 CI 那天起就没成功过，每次 push 都是一个红叉 —— 红在那里没人会去点开看。
      # 改成：没配 token 就跳过 + 在运行摘要上挂一条 warning，写明怎么配；配了 token 就照常部署。
      - name: 有没有 Cloudflare token
        id: token
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::warning title=部署这一步跳过了::仓库没配 CF_API_TOKEN，所以只有自检和冒烟跑了，线上代码没更新。配法见 DEPLOYMENT.md 1.4 节（Settings → Secrets and variables → Actions → New repository secret）。"
            echo "can=false" >> "$GITHUB_OUTPUT"
            # 只打一行 ::warning 容易被忽略（日志要展开才看得到）。同时写进运行摘要页，
            # 点进这次 run 第一眼就能看到「这次 push 没有上线」。
            {
              echo "## ⚠️ 这次 push 没有部署到线上"
              echo ""
              echo "仓库没配 \`CF_API_TOKEN\`，所以只跑了自检 + 冒烟，**线上代码还是旧的**。"
              echo ""
              echo "配法：Settings → Secrets and variables → Actions → New repository secret，名字 \`CF_API_TOKEN\`。"
              echo "配好之前，改完后请在本机手动部署：\`cd backend && CLOUDFLARE_API_TOKEN=… npx wrangler deploy --var APP_VERSION:…\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "can=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 部署到 Cloudflare
        id: deploy
        if: steps.token.outputs.can == 'true'
        # 版本号必须带上去：wrangler.toml 里写的是 APP_VERSION="dev"，
        # 以前光跑 `wrangler deploy`，线上 /version 永远是 dev，出了事分不清哪次部署。
        run: >-
          npx wrangler deploy
          --var APP_VERSION:"$(date -u +%Y%m%d-%H%M)"
          --var APP_BUILT:"$(date -u +%FT%TZ)"
          --var APP_COMMIT:"${{ github.sha }}"
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb907fe08010a1b319f68be568331ce5

      - name: 部署后验版本
        if: steps.token.outputs.can == 'true'
        run: |
          sleep 5
          curl -fsS https://jz.qy663.de5.net/version | tee /tmp/ver.json
          echo
          if grep -q '"version":"dev"' /tmp/ver.json; then
            echo "::error title=版本号没带上去::线上 /version 还是 dev，说明 --var 没生效"
            exit 1
          fi

      # 线上到底跑的是哪一版：和这次 push 的 commit 对不上就在摘要里写清楚（不算失败，
      # 因为部署可能是手动的、顺序也可能反），至少别让人以为「CI 绿了就等于上线了」。
      - name: 线上版本 vs 这次 push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          node -e '
            const sha = process.env.GITHUB_SHA || "";
            const fs = require("fs");
            fetch("https://jz.qy663.de5.net/version").then((r) => r.json()).then((d) => {
              const live = String(d.commit || "");
              const same = live && (live === sha || sha.startsWith(live) || live.startsWith(sha.slice(0, 7)));
              const lines = ["## 线上版本", "", "- 这次 push：`" + sha + "`", "- 线上在跑：`" + (live || "不知道") + "`", "- 版本号：`" + String(d.version || "") + "`"];
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
              console.log(lines.join(" "));
              if (!same) console.log("::warning title=线上不是这次 push 的代码::线上 commit=" + (live || "空") + "，这次 push=" + sha + "（如果是手动 CLI 部署，部署完这条提示就过时了）");
            }).catch((e) => console.log("::warning title=问不到 /version::" + e.message));
          '

      # 线上表结构对比：本机自检只能证明「schema.sql 在空库上建得出来」，
      # 证明不了「线上那个库到底缺不缺列」。这里用一把只读口令把线上所有 GET 接口打一遍，
      # 再问一次 /schema-check —— 线上真缺列时会明确列出哪张表缺哪个字段。
      # 口令要单独配一个 GitHub secret（PROD_KEY = 线上老板口令）；没配就跳过并挂 warning，
      # 不会因为没配就红一片。
      # 这一步以前也挂在「有没有 CF token」上：结果是「本机手动部署了（没走 CI）」时，
      # 线上体检永远不跑。现在只要有 PROD_KEY 就跑，跟部署在不在 CI 里无关。
      - name: 线上表结构与接口体检
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PROD_KEY: ${{ secrets.PROD_KEY }}
        run: |
          if [ -z "$PROD_KEY" ]; then
            echo "::warning title=线上体检跳过了::仓库没配 PROD_KEY（线上老板口令），跳过了部署后的线上体检。配法：Settings → Secrets → New repository secret，名字 PROD_KEY。"
            exit 0
          fi
          node scripts/smoke.mjs --base https://jz.qy663.de5.net --key "$PROD_KEY"
          node -e '
            const k = process.env.PROD_KEY;
            fetch("https://jz.qy663.de5.net/schema-check", { headers: { "x-access-key": k } })
              .then((r) => r.json())
              .then((d) => {
                // 以前只判 ok===false，而 /schema-check 的 ok 恒为 true —— 线上真缺列也绿。
                // 现在两样都判：ok 必须真的 true，bad_count 必须是 0。
                if (!d || d.ok !== true || Number(d.bad_count || 0) > 0) {
                  console.error("线上表结构有问题：" + JSON.stringify((d && (d.text || d.books)) || d));
                  process.exit(1);
                }
                console.log("线上表结构对得上：" + JSON.stringify(d.books || "ok"));
              })
              .catch((e) => { console.error("问不到 /schema-check：" + e.message); process.exit(1) });
          '

      # 部署完了但线上体检没过（缺列、接口 500）→ 自动退回上一版，别让坏版本挂着。
      # 只在这一步「真的部署过」时才回滚，没配 token 的情况下什么都不做。
      - name: 体检没过就自动回滚
        if: failure() && steps.deploy.outcome == 'success' && steps.token.outputs.can == 'true'
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb907fe08010a1b319f68be568331ce5
        run: |
          echo "::error title=部署回滚::部署后体检没过，自动退回上一版"
          npx wrangler rollback --message "CI 自动回滚：部署后体检没过（${{ github.sha }}）" || {
            echo "::error::自动回滚也失败了，请手工处理：cd backend && npx wrangler rollback"; exit 1; }
          {
            echo "## ⚠️ 已自动回滚"
            echo ""
            echo "部署后体检没过，线上已退回上一版。commit：\`${{ github.sha }}\`"
            echo "先看这次 run 的日志定位，再决定重新部署还是本地手工 deploy。"
          } >> "$GITHUB_STEP_SUMMARY"
