# 一个人的小厂记账 —— 自托管部署（docker compose up -d 就能用）
#
# 用法：
#   1. mkdir -p /opt/factory-accounting/data && cd /opt/factory-accounting
#   2. 把这个文件存成 docker-compose.yml
#   3. docker compose up -d
#   4. 浏览器打开 http://<这台机器IP>:8787  → 设老板口令（恢复码抄下来）
#   5. 微信小程序「我的 → 设置 → 服务器地址」改成 http://<这台机器IP>:8787
#
# 镜像两个 arch 都有（amd64 / arm64，群晖、树莓派、N100 小主机都能跑）。
# 账本数据全在 ./data 里的九个 SQLite 文件（book1..book9.db，一本账一个文件），备份就是拷这个目录。

services:
  factory-accounting:
    image: ghcr.io/tel9980/factory-accounting:v1.3.0
    container_name: factory-accounting
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      # 监听端口（容器内）；对外端口看上面 ports 的左边
      PORT: "8787"
      # 账本放在哪。别改，改了要在 volumes 里对上
      FACTORY_DATA: /data
      # 时间口径统一按北京时间（月结、账龄、对账单都按这个算）
      TZ: Asia/Shanghai
      # 想给线上这台起个版本号，部署后 /version 能看到
      FACTORY_VERSION: compose-${FACTORY_VERSION:-v1.3.0}
    volumes:
      # 账本本体。左边是你机器上的目录，绝对路径最省心（相对路径会落在 compose 项目目录里）
      - ./data:/data
    healthcheck:
      # 容器里没有 curl，用 node 自己探（镜像本来就带 node）
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||8787)+'/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      # 不限制的话，json 日志能把小主机的盘写满
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ── 常见问题 ────────────────────────────────────────────────
# 换新版本：docker compose pull && docker compose up -d
# 看日志：  docker compose logs -f
# 停掉：    docker compose down
# 手动备份：tar czf backup-$(date +%F).tgz data/      （停容器更保险，或者只拷 data 里的 .db）
# 恢复：    docker compose down && 解包覆盖 data/ && docker compose up -d
# 只给自己家用、不放到公网：别在路由器上给 8787 做端口映射；
#   要远程用，套一层 cloudflared / tailscale，别再自己写反代+证书。
# 定时任务：容器自带（每天备份/体检/固定支出、每周一汇总、每月 1 号报表包），不需要额外 crontab。
