name = "factory-accounting"
main = "index.js"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "factory-db"
database_id = "7d00bd33-0ff9-45f9-9af9-adec053f4e82"
# 读复制（read replication）：查过了，现在是 disabled，故意没开。
#   1) 开了之后读请求会就近走副本，但副本有延迟 —— 这套系统到处是「刚记完一笔就刷新看」，
#      副本晚几百毫秒就会显示「没记上」，人会以为没存进去再记一遍，账就重了。
#   2) 要安全用必须配 Sessions API（env.DB.withSession('first-primary') 把写后读钉回主库），
#      399 个接口逐个改，改动面比收益大得多。
#   3) 现在库里 594KB、每天读 3.3 万行，读复制省的那点延迟根本看不见。
# 真要开（wrangler 4 才支持这个配置键；现在用的是 3.114）：
#   npx wrangler d1 info factory-db        # 先看 read_replication.mode
#   在 Cloudflare 控制台 D1 → 选库 → Settings 里打开，或 PATCH /accounts/<id>/d1/database/<db> {"read_replication":{"mode":"auto"}}
#   然后把下面这行取消注释（本地 dev 也用得上）：
# read_replication = { mode = "auto" }

[triggers]
crons = ["0 16 * * *", "0 1 * * *", "0 1 * * 1", "0 2 1 * *"]

# Workers Logs：把 console.log/error 留在 Cloudflare 里可以翻（默认不保留，出事只能靠 error_log 表）。
# 这块在 wrangler 3.114 上是支持的；如果哪天部署报「unexpected field」，删掉这一段不影响别的。
[observability]
enabled = true
head_sampling_rate = 0.1   # 采样 10%，免费额度按事件计费，全采太贵

[vars]
NOTES_BASE = "https://md.1211.cc.cd"
NOTES_SLUG = "factory-ledger-backup"
# 版本号：部署时用 --var 覆盖（见 DEPLOYMENT.md 1.4），/version 会把它显示出来。
# 留着默认值是为了本地 dev 不报错。
APP_VERSION = "dev"
APP_BUILT = ""
APP_COMMIT = ""
# NOTES_PASS 用 secret 存：npx wrangler secret put NOTES_PASS

# 多账套：每个账套一个独立 D1 数据库（表结构完全一致）
[[d1_databases]]
binding = "DB2"
database_name = "factory-db2"
database_id = "ace7317a-e855-461a-84c5-8f15a7a9ed05"

[[d1_databases]]
binding = "DB3"
database_name = "factory-db3"
database_id = "9b20177a-de3d-46f0-a69f-e787336c09b6"
